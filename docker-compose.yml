version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: search-system-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: search_system
      POSTGRES_PASSWORD: search_system
      POSTGRES_DB: search_system
    ports:
      - "5432:5432"
    volumes:
      - search_system_pgdata:/var/lib/postgresql/data

volumes:
  search_system_pgdata:
